[theme]
base = "light"
primaryColor = "#AA8551"
backgroundColor = "#FAF9F6"
secondaryBackgroundColor = "#F4EFE6"
textColor = "#263344"
font = "sans serif"
borderColor = "#E0E1E2"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#24364A"
secondaryBackgroundColor = "#354B63"
