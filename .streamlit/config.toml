[theme]
base = "light"
primaryColor = "#85551F"
backgroundColor = "#FAF7EF"
secondaryBackgroundColor = "#F1E9D9"
textColor = "#27362D"
font = "sans serif"
borderColor = "#D6C7AE"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#20342B"
secondaryBackgroundColor = "#34493A"
textColor = "#FFF5E3"
