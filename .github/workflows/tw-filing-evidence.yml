name: 台股官方公告時間存檔

on:
  push:
    branches: [main]
    paths:
      - engine/archive-tw-disclosures.mjs
      - engine/archive-tw-financial-statements.mjs
      - engine/archive-tw-otc-evidence.mjs
      - engine/tw-financial-reconciliation.mjs
      - .github/workflows/tw-filing-evidence.yml
  schedule:
    # Monday-Friday 21:45 Asia/Taipei (13:45 UTC).
    - cron: '45 13 * * 1-5'
    # Monday-Saturday 08:45 Asia/Taipei (00:45 UTC).
    # Next-morning recheck captures announcements after the evening collection.
    - cron: '45 0 * * 1-6'
  workflow_dispatch:
  workflow_run:
    workflows: ["收盤研究更新"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  # Serialise with the official research writer; never drop archive writes
  # because market research is publishing concurrently.
  group: research-publish
  cancel-in-progress: false

jobs:
  archive-twse-disclosures:
    # Reconcile immediately after a successful research run. Failed research
    # must never be mistaken for a successful source observation.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check timestamp parser and no-lookahead trust boundaries
        run: node --test tests/tw-official-disclosure-archive.test.mjs tests/tw-official-financial-statements.test.mjs tests/tw-otc-filing-evidence.test.mjs tests/tw-financial-reconciliation.test.mjs
      - name: Load last archived Taiwan evidence
        shell: bash
        run: |
          git fetch --depth=1 origin research-data
          git worktree add --detach /tmp/research-data FETCH_HEAD
          test -s /tmp/research-data/financial-versions/TW.json
      - name: Avoid repeating official APIs after same-close or US retries
        id: capture
        run: |
          node -e 'const fs=require("fs"); const a=require("/tmp/research-data/release.json").attempt; fs.appendFileSync(process.env.GITHUB_OUTPUT,"required="+(a.market==="TW" && a.status==="published" && a.quoteCount===80)+"\n")'
      - name: Query official TWSE announcements and archive time down to seconds
        if: github.event_name != 'workflow_run' || steps.capture.outputs.required == 'true'
        # A material announcement does NOT certify a complete quarterly report.
        run: node engine/archive-tw-disclosures.mjs /tmp/research-data/financial-versions/TW.json /tmp/research-data/filing-evidence/TW
      - name: Archive official TWSE quarterly income values separately
        if: github.event_name != 'workflow_run' || steps.capture.outputs.required == 'true'
        # This records first-seen official figures, not each issuer's exact
        # original filing timestamp. Never auto-approve strategy replay.
        run: node engine/archive-tw-financial-statements.mjs /tmp/research-data/financial-versions/TW.json /tmp/research-data/filing-evidence/TW
      - name: Commit verified TWSE observations before starting OTC network requests
        # OTC timeout must never discard already validated listed-company evidence.
        # If OTC later fails, this workflow STILL fails visibly.
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/research-data add filing-evidence/TW/
          if ! git -C /tmp/research-data diff --cached --quiet; then
            git -C /tmp/research-data commit -m "Preserve verified TWSE disclosure and financial observation"
            git -C /tmp/research-data push origin HEAD:refs/heads/research-data
          fi
      - name: Archive official TPEx OTC quarterly statements and disclosure timestamps
        if: github.event_name != 'workflow_run' || steps.capture.outputs.required == 'true'
        # Listed and OTC are different exchanges and APIs.
        # Missing OTC data is a visible failure, never treated as company non-filing.
        run: node engine/archive-tw-otc-evidence.mjs /tmp/research-data/financial-versions/TW.json /tmp/research-data/filing-evidence/TW
      - name: Reconcile official cumulative NTD-thousands against observed FinMind quarterly NTD
        # This is an AUDIT-ONLY comparison. Matching figures do not provide
        # original filing time or authorize historical strategy trades.
        run: node engine/tw-financial-reconciliation.mjs /tmp/research-data /tmp/research-data/filing-evidence/TW
      - name: Publish official announcement archive and retrieval receipts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/research-data add filing-evidence/TW/
          if ! git -C /tmp/research-data diff --cached --quiet; then
            git -C /tmp/research-data commit -m "Record official TWSE disclosure and quarterly statement evidence"
            git -C /tmp/research-data push origin HEAD:refs/heads/research-data
          fi
