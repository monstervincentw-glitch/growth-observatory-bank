name: 收盤研究更新
on:
  schedule:
    - cron: '17 22 * * 1-5'
    - cron: '27 13 * * 1-5'
  push:
    branches: [main]
    paths: ['engine/market-observations.mjs', 'engine/providers.ts']
  workflow_dispatch:
    inputs:
      market:
        description: '市場'
        type: choice
        options: [US, TW]
        required: true
permissions:
  contents: write
concurrency:
  group: research-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MARKET: ${{ inputs.market || ((github.event.schedule == '17 22 * * 1-5' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[research-us]'))) && 'US' || 'TW') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Load last verified batch
        shell: bash
        run: |
          touch /tmp/research-weekly.txt
          echo '{}' > /tmp/financial-versions.json
          if git ls-remote --exit-code origin refs/heads/research-data >/dev/null; then
            git fetch --depth=1 origin research-data
            git show FETCH_HEAD:release.json > /tmp/research-prior.json
            git ls-tree --name-only FETCH_HEAD:weekly-vintages 2>/dev/null | sed 's/\.json$//' > /tmp/research-weekly.txt || true
          else
            node engine/seed.mjs /tmp/research-prior.json
          fi
      - name: Load previous financial versions
        run: |
          if git cat-file -e "FETCH_HEAD:financial-versions/$MARKET.json" 2>/dev/null; then
            git show "FETCH_HEAD:financial-versions/$MARKET.json" > /tmp/financial-versions.json
          fi
      - name: Calculate and validate research
        env:
          PERFORMANCE_INPUT_DIR: /tmp/performance-market-inputs
          FINANCIAL_VERSION_INDEX: /tmp/financial-versions.json
          PERFORMANCE_ETF_CONTEXT: /tmp/performance-etf-context.json
        run: node engine/update.mjs "$MARKET" /tmp/research-prior.json /tmp/research-release.json
      - name: Publish result without changing the app branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/research-data >/dev/null; then
            git worktree add -b research-data /tmp/research-publish FETCH_HEAD
          else
            git worktree add --detach /tmp/research-publish HEAD
            git -C /tmp/research-publish switch --orphan research-data
          fi
          cp /tmp/research-release.json /tmp/research-publish/release.json
          node -e 'process.stdout.write(JSON.stringify(require("/tmp/research-release.json").attempt)+"\n")' > /tmp/research-publish/attempt.json
          node -e 'process.stdout.write(JSON.stringify(require("/tmp/research-release.json").attempts)+"\n")' > /tmp/research-publish/attempts.json
          git -C /tmp/research-publish add release.json attempt.json attempts.json
          git -C /tmp/research-publish commit -m "Record close research run"
          git -C /tmp/research-publish push origin HEAD:refs/heads/research-data
      - name: Collect missing ETF instruments using the same research provider
        continue-on-error: true
        timeout-minutes: 8
        run: |
          if [[ -s /tmp/performance-etf-context.json ]]; then
            node engine/replay-export.mjs /tmp/performance-etf-context.json /tmp/performance-market-inputs /tmp/research-weekly.txt
          fi
      - name: Save verified inputs for the performance engine
        continue-on-error: true
        shell: bash
        run: |
          if [[ -d /tmp/performance-market-inputs ]]; then
            shopt -s nullglob
            for file in /tmp/performance-market-inputs/etf-inputs/*.json; do
              previous="/tmp/research-publish/etf-inputs/${file##*/}"
              if [[ -f "$previous" ]] && node -e 'const [a,b]=process.argv.slice(1).map(require); process.exit(a.status==="VERIFIED" && b.status!=="VERIFIED"?0:1)' "$previous" "$file"; then
                rm -- "$file"
              fi
            done
            for file in /tmp/performance-market-inputs/market-{observations,prices}/*/*.json; do
              relative="${file#/tmp/performance-market-inputs/}"
              previous="/tmp/research-publish/$relative"
              if [[ -f "$previous" ]] && node -e 'const [a,b]=process.argv.slice(1).map(require); process.exit(a.day>b.day || (a.day===b.day && a.status==="PRICES_VERIFIED" && b.status!=="PRICES_VERIFIED")?0:1)' "$previous" "$file"; then
                rm -- "$file"
              fi
            done
            cp -R /tmp/performance-market-inputs/. /tmp/research-publish/
            git -C /tmp/research-publish add --all
            if ! git -C /tmp/research-publish diff --cached --quiet; then
              git -C /tmp/research-publish commit -m "Save market inputs for performance"
              git -C /tmp/research-publish push origin HEAD:refs/heads/research-data
            fi
          fi
      - name: Preserve existing research failure reporting
        run: node -e 'if (require("/tmp/research-release.json").attempt.status === "failed") process.exitCode = 1'
