name: 台股每日估值延伸安全測試

on:
  push:
    branches: [fix/tw-show-conditional-nav-to-1116-20261117]
  pull_request:
    branches: [main]
    paths:
      - performance/conditional_curve.py
      - performance/primary_valuation.py
      - tests/test_tw_conditional_nav_curve.py
      - streamlit_app.py
      - .github/workflows/performance-incremental-update.yml
      - .github/workflows/tw-conditional-nav-check.yml

permissions:
  contents: read

jobs:
  conditional-nav-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m py_compile performance/conditional_curve.py performance/primary_valuation.py streamlit_app.py
      - name: Verify seal, holdings, cash and daily mark integrity
        run: python -m unittest discover -s tests -p test_tw_conditional_nav_curve.py -v
      - name: Ensure conditional data never overwrite official trading records
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('streamlit_app.py').read_text()
          p=Path('performance/conditional_curve.py').read_text()
          w=Path('.github/workflows/performance-incremental-update.yml').read_text()
          # The live strategy curve now includes the official-document-dated
          # historical trading span. Keep fixed-position valuation out of the
          # main chart so the user sees one A/B backtest, not duplicates.
          assert 'st.subheader("A／B 歷史淨值")' in s
          assert 'primary_performance(market)' in s
          assert 'A／B 策略交易重建' not in s
          assert 'A／B 固定持倉逐日估值' not in s
          assert 'noPostAnchorTrading' in s
          assert "tradingReplayVerified':False" in p
          assert 'primary-marks/' not in p or 'primary/' not in p
          assert 'on:' in w and 'push:' in w
          PY
