name: 台股財報電子書原始上傳時間驗證
on:
  push:
    branches: [fix/tw-pit-daily-availability-matrix-20261117, main]
    paths:
      - engine/archive-tw-official-ebooks.mjs
      - engine/tw-official-ebook-merge.mjs
      - tests/tw-official-ebooks.test.mjs
      - tests/tw-official-ebook-merge.test.mjs
      - .github/workflows/tw-official-ebook-archive.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact official timestamp and complete-shard audit guards
        run: node --test tests/tw-official-ebooks.test.mjs tests/tw-official-ebook-merge.test.mjs
  fetch-official:
    needs: verify
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Load exact 80-stock research universe
        shell: bash
        run: |
          git fetch --depth=1 origin research-data
          git show FETCH_HEAD:financial-versions/TW.json > /tmp/tw-versions.json
          test -s /tmp/tw-versions.json
      - name: Fetch 10 unique stock codes across 2025 and 2026 from official MOPS
        run: |
          node engine/archive-tw-official-ebooks.mjs /tmp/tw-versions.json /tmp/mops ${{ matrix.shard }} 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-shard-${{ matrix.shard }}
          path: /tmp/mops/official-book-upload-review-2026-11-17.shard-${{ matrix.shard }}.json
          retention-days: 3
          if-no-files-found: warn
  combine:
    needs: fetch-official
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: official-shard-*
          merge-multiple: true
          path: /tmp/shards
      - name: Prepare immutable research-data evidence branch
        run: |
          git fetch --depth=1 origin research-data
          git worktree add --detach /tmp/research-data FETCH_HEAD
      - name: Merge eight independent official filing upload audits
        run: |
          node engine/tw-official-ebook-merge.mjs /tmp/research-data/financial-versions/TW.json /tmp/shards /tmp/research-data/filing-evidence/TW
      - name: Preserve result even if official source is partial
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/research-data/filing-evidence/TW/official-book-upload-review-2026-11-17.json ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C /tmp/research-data add filing-evidence/TW/official-book-upload-review-2026-11-17.json
            if ! git -C /tmp/research-data diff --cached --quiet; then
              git -C /tmp/research-data commit -m "Validate MOPS annual upload timestamps in eight independent batches"
              git -C /tmp/research-data push origin HEAD:refs/heads/research-data
            fi
          fi
